		<!-- The first call to each of these lands ~2.4s into the load, once the app has
		     booted, so DNS + TLS are paid at the worst possible moment. Warming the
		     three connections here costs nothing and saves that handshake: the API
		     (every page), the icon CDN (the whole chrome) and the image CDN (top bar).

		     warmed socket cannot be reused. Ad hosts are deliberately NOT preconnected. -->

		<style>@layer theme, base, ngzorro, customs, components, utilities, cdk-overlay;</style>

		<!-- Boot splash — see #app-splash in <body>. The classifier runs here, before the body is
		     parsed, so the skeleton is painted in its final shape and never flashes. It mirrors
		     APP_ROUTES: `/user/**`, `/not-found` and the league-less root take the external shell;
		     the auth pages, the embedded webview and the stylesheet showcase get nothing; any other
		     first segment is a league alias, hence the internal shell. -->
		<script>
			(function () {
				var seg = location.pathname.split('/').filter(Boolean);
				var kind = 'internal';
				if (!seg[0] || seg[0] === 'user' || seg[0] === 'not-found') kind = 'external';
				else if (/^(login|logout|embed|embed-test|stylesheet)$/.test(seg[0]) || seg[1] === 'webview') kind = 'none';
				document.documentElement.setAttribute('data-splash', kind);
			})();
		</script>
		<style>
			/* Boot splash. Inline on purpose: once the builder has inlined the critical CSS the
			   stylesheet loads non-blocking, and these rules must be there for the first paint. The
			   theme variables live in that stylesheet, hence the fallbacks (theme.less values).
			
			   EVERY box below was MEASURED on the running shell at 1280x900 and 390x844, not derived
			   from the templates: deriving them put the mobile header at 198px when it is 100, kept a
			   team card that mobile hides, and left the menu in the header when mobile floats it at the
			   bottom of the screen. `e2e/boot-splash.e2e.mjs` compares the two at both sizes, so a
			   layout change that moves the real header makes that file go red — which is the only thing
			   keeping this stylesheet honest. */
			#app-splash {
				display: none;
				position: fixed;
				inset: 0;
				/* ABOVE the app, not behind it — above the header's own --z-app-bar (300) and below the
				   ng-zorro overlays (1000). Behind was the first design and it does not work: <main> is
				   opaque, so the moment Angular renders it the skeleton is covered, and what the reader
				   gets is the half-built header underneath — one placeholder pill and the translucent
				   circle of a team logo still downloading. Hiding those pieces instead only moves the
				   problem (measured 17/09: the band went empty, then white). On top, the skeleton simply
				   stays whole until the real shell is whole, and the two have the same geometry.
				   LayoutComponentAbstract takes it away at the first Page.ready, with a timeout as a
				   backstop so nothing it cannot foresee can leave the page covered. */
				z-index: 500;
				overflow: hidden;
				pointer-events: none;
				--splash-page: var(--page, #e8effc);
				--splash-primary: var(--primary, #0256D1);
				--splash-surface: var(--surface, #ffffff);
				--splash-ink: rgb(0 0 0 / 10%);
			}
			html[data-splash="internal"] #app-splash,
			html[data-splash="external"] #app-splash { display: block; }
			/* One class each, and deliberately NOT `#app-splash span`: that carries an id's
			   specificity, so it beat every `display: none` and every `position: fixed` written
			   afterwards — the mobile skeleton kept drawing a notifications button and a team card the
			   real shell hides, and left the menu in the header instead of at the foot of the screen.
			   Same weight as the rules that override them, so source order decides, which is what one
			   reads off the page. */
			.splash-pill, .splash-avatar, .splash-league, .splash-competition,
			.splash-chevron { position: absolute; display: block; }

			/* ui-top-bar: fixed, py-1, the brand gradient; the strip image sits in a 1080px box.
			   The stops are `--brand-strip` of theme.less spelled out: the splash paints before the
			   stylesheet that defines the token is there, so this copy is kept in step by hand. */
			.splash-strip { position: absolute; top: 0; left: 0; width: 100%; padding-block: 4px; background: linear-gradient(90deg, #0015FF 0%, #00FAFF 100%); }
			.splash-strip div { width: 1080px; margin: 0 auto; }
			.splash-strip img { display: block; width: 274px; height: 21px; }

			/* The page card: measured at 95,192 1080x188+ on a 1280 viewport. Both shells scroll inside
			   their own host, so the card lives in the viewport MINUS the scrollbar — hence the
			   half-scrollbar shift and the capped max-width. Guessing that width is what put the
			   skeleton 5px off the real page, so --splash-sbw is measured in the document instead; it
			   resolves to 0 where scrollbars are overlays, which is right there too. */
			.splash-page { position: absolute; top: 192px; left: 50%; width: 1080px; max-width: calc(100% - var(--splash-sbw, 0px)); height: 1024px; transform: translateX(calc(-50% - var(--splash-sbw, 0px) / 2)); border-radius: 30px; background: var(--splash-page); }
			html[data-splash="external"] .splash-page { top: 190px; }

			/* ui-main-header: bg-primary under the showcase pattern, rounded-t-2xl. 188px with the team
			   card inside it, 100 without (the external shell, and mobile). The pattern is the very file
			   the real header loads, so for that one the request is a cache hit. */
			.splash-header { position: relative; height: 188px; border-radius: 30px 30px 0 0; background: var(--splash-primary) url(assets/images/default/showcase_pattern.webp) center / cover no-repeat; }
			html[data-splash="external"] .splash-header { height: 100px; }

			/* What the header carries, measured relative to the page card: the context switcher at 8,8,
			   the menu at 362,8 (355x50, i.e. centred), the notifications button at 930,8 (50x50) and
			   the user badge at 996,8.
			
			   Two of those ghosts are deliberately NOT as wide as the control they stand for, because
			   the control does not start that wide either:
			   - the user badge is 76 wide once settled, but it enters as its avatar alone and grows as
			     the chevron uncollapses (`h-uncollapse`), so the ghost is the CIRCLE it starts from;
			   - the switcher is as wide as the league's name (266 on the fixture), so the ghost is the
			     180 it starts from and the real pill grows from the same 180 (`switcher-grow`). The
			     placeholder inside ui-context-switcher uses that number too: the three have to agree. */
			.splash-pill { top: 8px; height: 50px; border-radius: 30px; background: var(--splash-surface); }
			.splash-switcher { left: 8px; width: 180px; }
			.splash-nav { left: 50%; width: 355px; transform: translateX(-50%); display: flex; justify-content: center; gap: 4px; padding: 0 15px; box-sizing: border-box; }
			.splash-nav span { position: relative; width: 60px; }
			.splash-nav span::before, .splash-nav span::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); border-radius: 4px; background: var(--splash-ink); }
			.splash-nav span::before { top: 9px; width: 16px; height: 16px; }
			.splash-nav span::after { top: 31px; width: 44px; height: 8px; }
			/* 74 and not 100: the real bell sits 16px (gap-4) to the left of the user badge, and the
			   badge is 50 wide while it enters — it reaches 76, pushing the bell out to 100, only once
			   its chevron has opened. The ghost copies where things START. */
			.splash-bell { right: 74px; width: 50px; border-radius: 50%; }
			.splash-user { right: 8px; width: 50px; border-radius: 50%; }
			.splash-avatar { top: 4px; width: 40px; height: 40px; border-radius: 50%; background: var(--splash-ink); }
			.splash-switcher .splash-avatar { left: 4px; }
			.splash-user .splash-avatar { right: 4px; }
			.splash-league { top: 11px; left: 54px; width: 90px; height: 14px; border-radius: 6px; background: var(--splash-ink); }
			.splash-competition { top: 30px; left: 54px; width: 60px; height: 10px; border-radius: 6px; background: var(--splash-ink); }
			.splash-chevron { top: 19px; right: 12px; width: 12px; height: 12px; border-radius: 3px; background: var(--splash-ink); }

			/* No ghost for ui-my-team-card, on purpose. It used to be drawn here as translucent white
			   shapes over the blue, and they read as smudges on the header rather than as a card about
			   to arrive. The band stays 188px all the same: that height comes from the REAL card, which
			   sits in the header and spills 20px below it. */
			html[data-splash="external"] .splash-nav { display: none; }

			/* Below md (768px = LayoutService.isMobile) the shell rearranges itself, and the skeleton
			   has to follow: no top bar, the internal page flush and full-height, a header of 100px
			   (the team card is DISPLAY:NONE there, which is what made it 188 on desktop), no
			   notifications button, and the menu floating at the bottom of the screen. Switcher, badge
			   and menu go `fixed` because the real ones hang off a `position: fixed` nav — they line up
			   with the VIEWPORT, not with the page, which is narrower by the scrollbar. */
			@media (max-width: 767px) {
				.splash-strip, .splash-bell { display: none; }
				html[data-splash="internal"] .splash-page { top: 0; left: 0; width: 100%; height: 100%; transform: none; border-radius: 0; }
				html[data-splash="internal"] .splash-header { height: 100px; border-radius: 0; }
				.splash-switcher, .splash-user, .splash-nav { position: fixed; }
				.splash-nav { top: auto; bottom: 8px; }
			}
		</style>

	<body>
		<!-- Boot splash: the shell, from the first paint on. Between the first paint (this
		     document plus the critical CSS the builder inlines) and Angular's first render
		     (download, parse and run of the eager bundle, then the route's lazy chunks) the page
		     used to be the background alone. This is a static, CSS-only rendition of the shell:
		     top strip, page card and the header piece by piece (pattern, context switcher, menu,
		     notifications, user badge), drawn with the SAME geometry as
		     layout-internal / layout-external, so the real shell lands exactly on top of it. It
		     sits UNDER app-root (z-index -1): while ui-loader dims the freshly rendered shell to
		     30%, the skeleton beneath keeps the structure looking solid, and
		     LayoutComponentAbstract removes it the first time Page.ready turns true. Not inside
		     <app-root>: Angular empties the host element when it bootstraps, long before any
		     layout has rendered. Strip and pattern are the real images, so the shell's own
		     requests for them are cache hits. -->
		<!-- How wide this browser draws a scrollbar, for the centring above. Measured rather than
		     assumed, on a probe that declares the same `scrollbar-width: thin` the app sets on
		     everything, so the answer does not depend on whether the stylesheet has arrived yet.
		     In the body and not in <head>: it needs somewhere to put the probe. -->
		<script>
			(function () {
				var probe = document.createElement('div');
				probe.style.cssText = 'position:absolute;top:-9999px;width:100px;height:100px;overflow-y:scroll';
				probe.style.scrollbarWidth = 'thin';
				document.body.appendChild(probe);
				var width = probe.offsetWidth - probe.clientWidth;
				probe.remove();
				document.documentElement.style.setProperty('--splash-sbw', width + 'px');
			})();
		</script>
		<div id="app-splash" aria-hidden="true">
			<div class="splash-strip"><div><img src="assets/images/sky_strip_2022.png" width="274" height="21" alt></div></div>
			<div class="splash-page">
